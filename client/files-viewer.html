<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Files Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-card .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        .files-section {
            margin-top: 30px;
        }

        .files-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .files-list {
            display: grid;
            gap: 12px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid #e0e0e0;
        }

        .file-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .file-meta {
            font-size: 12px;
            color: #999;
        }

        .file-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-left: 20px;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            padding: 16px;
            color: #c33;
            margin-bottom: 20px;
        }

        .success {
            background: #efe;
            border: 1px solid #cfc;
            border-radius: 6px;
            padding: 16px;
            color: #3c3;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .file-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-actions {
                margin-left: 0;
                margin-top: 12px;
                width: 100%;
            }

            .download-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Generated Documents</h1>
            <button class="refresh-btn" onclick="loadFiles()">
                [Refresh]
            </button>
        </div>

        <div id="message"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">Total Files</div>
                <div class="value" id="total-files">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Size</div>
                <div class="value" id="total-size">0 MB</div>
            </div>
            <div class="stat-card">
                <div class="label">Latest</div>
                <div class="value" id="latest-time">-</div>
            </div>
        </div>

        <div class="files-section">
            <h2>All Documents</h2>
            <div id="files-container" class="loading">
                <div class="spinner"></div>
                Loading files...
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function loadFiles() {
            try {
                const container = document.getElementById('files-container');
                container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading files...</div>';

                const response = await fetch(`${API_URL}/files`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayFiles(data);
            } catch (error) {
                showError(`Failed to load files: ${error.message}`);
            }
        }

        function displayFiles(data) {
            const files = data.files || [];
            const container = document.getElementById('files-container');

            // Update stats
            document.getElementById('total-files').textContent = files.length;

            let totalSize = 0;
            files.forEach(f => totalSize += f.size_bytes);
            document.getElementById('total-size').textContent = (totalSize / (1024 * 1024)).toFixed(2) + ' MB';

            if (files.length > 0) {
                const latestDate = new Date(files[0].created);
                document.getElementById('latest-time').textContent = latestDate.toLocaleDateString();
            }

            // Display files
            if (files.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No documents generated yet</p>
                        <p style="font-size: 13px; margin-top: 10px;">Generated documents will appear here</p>
                    </div>
                `;
            } else {
                container.innerHTML = '<div class="files-list"></div>';
                const list = container.querySelector('.files-list');

                files.forEach(file => {
                    const date = new Date(file.created);
                    const dateStr = date.toLocaleString();

                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.filename)}</div>
                            <div class="file-meta">
                                Size: ${file.size_mb} MB | Created: ${dateStr}
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="download-btn" onclick="downloadFile('${escapeHtml(file.filename)}')">
                                [Download]
                            </button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            showSuccess(`Loaded ${files.length} document(s)`);
        }

        async function downloadFile(filename) {
            try {
                const link = document.createElement('a');
                link.href = `${API_URL}/download/${encodeURIComponent(filename)}`;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showSuccess(`Downloaded: ${filename}`);
            } catch (error) {
                showError(`Failed to download: ${error.message}`);
            }
        }

        function showError(message) {
            const container = document.getElementById('message');
            container.innerHTML = `<div class="error">[ERROR] ${escapeHtml(message)}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            const container = document.getElementById('message');
            container.innerHTML = `<div class="success">[OK] ${escapeHtml(message)}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load files on page load
        window.addEventListener('load', loadFiles);

        // Auto-refresh every 5 seconds
        setInterval(loadFiles, 5000);
    </script>
</body>
</html>
